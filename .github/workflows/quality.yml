name: Portfolio quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npm run test
      - run: npm run build
        env:
          SITE_URL: https://knliiss.github.io
          BASE_PATH: /
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-site
          path: dist/
          if-no-files-found: error
