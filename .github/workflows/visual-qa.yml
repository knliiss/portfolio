name: Visual quality audit
# Images are explicitly loaded before checking screenshots.
on:
  push:
    paths:
      - .github/workflows/visual-qa.yml
      - 'src/**'
      - 'public/media/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
        env:
          SITE_URL: https://portfolio.knalis.rest
          BASE_PATH: /
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Render desktop and mobile pages
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/portfolio-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          timeout 150s node scripts/visual-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-visual-qa
          path: visual-qa/
          if-no-files-found: ignore
